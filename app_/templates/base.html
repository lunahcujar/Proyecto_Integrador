<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi App de Cuidado de la Piel{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fffaf0;
            margin: 0;
            padding: 0;
            color: #333;
        }

        nav {
            background-color: #f8e1e7;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-bottom: 4px solid #e4bcc9;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Logo y texto */
        nav .logo {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        nav .logo img {
            height: 70px;     /* tamaño grande */
            width: auto;      /* mantiene proporción */
            border-radius: 50%;
            object-fit: contain;
            filter: contrast(1.2) brightness(1.1);
        }

        nav .logo span {
            font-weight: 700;
            color: #a85d74;
            font-size: 1.5rem; /* texto más grande */
        }

        /* Enlaces */
        nav .links {
            display: flex;
            gap: 1.5rem;
        }

        nav .links a {
            text-decoration: none;
            color: #a85d74;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.3s, border-bottom 0.3s;
            padding-bottom: 3px;
        }

        nav .links a:hover {
            color: #7a4054;
            border-bottom: 2px solid #7a4054;
        }

        main {
            padding: 2rem;
            max-width: 1100px;
            margin: auto;
        }

        footer {
            text-align: center;
            padding: 1.5rem 1rem;
            background-color: #f8e1e7;
            color: #a85d74;
            font-size: 0.9rem;
            margin-top: 3rem;
            border-top: 2px solid #e4bcc9;
        }

        @media (max-width: 768px) {
            nav {
                flex-direction: column;
                align-items: center;
            }
            nav .links {
                flex-wrap: wrap;
                justify-content: center;
            }
            main {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">
            <img src="{{ url_for('static', path='img/logo.png') }}" alt="Cuidado de la Piel">
            <span>Cuidado de la Piel</span>
        </div>
        <div class="links">
            <a href="/login">Login</a>
            <a href="/signup">Sign in</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Bloque para scripts personalizados -->
    {% block scripts %}{% endblock %}

    <footer>
        &copy; 2025 Cuidado de la Piel. Todos los derechos reservados.
    </footer>
</body>
</html>
