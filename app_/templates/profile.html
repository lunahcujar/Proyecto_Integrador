
{% extends "base.html" %}
{% block title %}Mi Perfil{% endblock %}

{% block content %}
<style>
    .profile-container {
        max-width: 700px;
        margin: 3rem auto;
        background: #fff;
        padding: 2rem;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        text-align: center;
    }
    .profile-container img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #a3d5ff;
    }
    input {
        width: 100%;
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 10px;
    }
    button {
        background-color: #58c78e;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
        margin-top: 15px;
    }
    button:hover {
        background-color: #46b179;
    }
</style>

<div class="profile-container">
    <h1>🌸 Mi Perfil de Cuidado Facial 🌸</h1>
    <img id="fotoPerfil" src="{{ usuario.foto_url or '/static/img/default-user.png' }}" alt="Foto de perfil">

    <form id="formPerfil" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="usuario_id" value="{{ usuario.id }}">
        <label>Edad:</label>
        <input type="number" name="edad" value="{{ usuario.edad or '' }}" placeholder="Ingresa tu edad">
        <label>Subir nueva foto:</label>
        <input type="file" name="foto">
        <button type="submit">Actualizar perfil ✨</button>
    </form>

    <p style="margin-top: 20px;">💚 {{ usuario.nombre }} — {{ usuario.correo }}</p>
</div>
{% endblock %}
