{% extends "base.html" %}

{% block title %}Test de Hábitos{% endblock %}

{% block content %}
<style>
    .quiz-container {
        max-width: 900px;
        margin: 3rem auto;
        padding: 3rem;
        background: #fff6f9;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        text-align: center;
    }

    .quiz-step {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
    }

    .quiz-step.active {
        display: flex;
    }

    .quiz-step img {
        width: 250px;
        border-radius: 1.5rem;
        object-fit: cover;
        box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        transition: transform 0.3s;
    }

    .quiz-step img:hover {
        transform: scale(1.05);
    }

    .quiz-step label {
        font-size: 1.5rem;
        font-weight: 600;
        color: #333;
    }

    .quiz-step select {
        padding: 14px;
        font-size: 1.1rem;
        border-radius: 10px;
        border: 1px solid #bbb;
        width: 60%;
    }

    .quiz-button {
        margin-top: 2rem;
        padding: 12px 35px;
        background-color: #ff69b4;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 1.2rem;
        transition: background-color 0.3s ease;
    }

    .quiz-button:hover {
        background-color: #e6549a;
    }

    h2 {
        font-size: 2rem;
        margin-top: 2rem;
        color: #c0392b;
    }

    @media screen and (max-width: 768px) {
        .quiz-container {
            padding: 2rem;
        }

        .quiz-step select {
            width: 100%;
        }

        h2 {
            font-size: 1.6rem;
        }
    }
</style>

<h2>Test de Hábitos de Cuidado de la Piel</h2>

<div class="quiz-container">
    <form id="habitsForm">
        <div class="quiz-step active" data-step="0">
            <img src="/static/img/lavado-cara.jpg" alt="Lavado de cara">
            <label for="lavado">¿Te lavas la cara dos veces al día?</label>
            <select id="lavado" name="lavado" required>
                <option value="">Seleccione</option>
                <option value="si">Sí</option>
                <option value="no">No</option>
            </select>
        </div>

        <div class="quiz-step" data-step="1">
            <img src="/static/img/protector-solar.jpg" alt="Protector solar">
            <label for="bloqueador">¿Usas protector solar diariamente?</label>
            <select id="bloqueador" name="bloqueador" required>
                <option value="">Seleccione</option>
                <option value="si">Sí</option>
                <option value="no">No</option>
            </select>
        </div>

        <div class="quiz-step" data-step="2">
            <img src="/static/img/exfoliacion.jpg" alt="Exfoliación">
            <label for="exfoliacion">¿Con qué frecuencia exfolias tu piel?</label>
            <select id="exfoliacion" name="exfoliacion" required>
                <option value="">Seleccione</option>
                <option value="nunca">Nunca</option>
                <option value="1_vez">1 vez por semana</option>
                <option value="2_veces">2 veces por semana</option>
                <option value="diario">A diario</option>
            </select>
        </div>

        <button type="button" class="quiz-button" id="nextBtn">Siguiente</button>
    </form>
</div>

<script>
const steps = document.querySelectorAll('.quiz-step');
let currentStep = 0;
const nextBtn = document.getElementById("nextBtn");

nextBtn.addEventListener("click", () => {
    const currentSelect = steps[currentStep].querySelector("select");
    if (!currentSelect.value) {
        alert("Por favor selecciona una opción.");
        return;
    }

    // Si estamos en el último paso, guarda los hábitos
    if (currentStep === steps.length - 1) {
        guardarHabitos();
        return;
    }

    // Mostrar siguiente paso
    steps[currentStep].classList.remove("active");
    currentStep++;

    if (currentStep < steps.length) {
        steps[currentStep].classList.add("active");

        if (currentStep === steps.length - 1) {
            nextBtn.textContent = "Finalizar";
        }
    }
});

async function guardarHabitos() {
    const user_id = localStorage.getItem("user_id");
    if (!user_id) {
        alert("No se encontró el usuario. Por favor regístrese primero.");
        return;
    }

    const habitos = [
        { name: "lavado", frequency: document.getElementById("lavado").value, user_id: parseInt(user_id) },
        { name: "bloqueador", frequency: document.getElementById("bloqueador").value, user_id: parseInt(user_id) },
        { name: "exfoliacion", frequency: document.getElementById("exfoliacion").value, user_id: parseInt(user_id) }
    ];

    try {
        const response = await fetch("/api/habitos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(habitos)
        });

        if (response.ok) {
            window.location.href = `/recomendaciones`;
        } else {
            const error = await response.json();
            alert("Error al guardar los hábitos: " + (error.detail || "Intenta más tarde."));
        }
    } catch (err) {
        alert("Error de conexión con el servidor.");
    }
}
</script>
{% endblock %}
