<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutina Personalizada</title>
    <style>
        body {
            font-family: "Poppins", sans-serif;
            background-color: #f7f3ff;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background-color: #b97cf7;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 22px;
            font-weight: 600;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #5e2bb8;
            margin-bottom: 20px;
        }

        .productos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .producto {
            background-color: #f0e6ff;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out;
        }

        .producto:hover {
            transform: scale(1.05);
        }

        .producto img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }

        .producto h4 {
            color: #5e2bb8;
            margin: 10px 0 5px;
        }

        .producto p {
            font-size: 14px;
            margin: 0;
        }

        .botones {
            text-align: center;
            margin-top: 25px;
        }

        .botones button {
            background-color: #a66df0;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        .botones button:hover {
            background-color: #8d4ce0;
        }

        #loading {
            text-align: center;
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <header>💜 Tu Rutina Personalizada</header>

    <main>
        <h2>Recomendaciones para ti</h2>

        <div id="loading">Cargando tu rutina, por favor espera...</div>

        <div id="rutinaContainer" class="productos" style="display: none;"></div>

        <div class="botones">
            <button onclick="volverPerfil()">← Volver a mi perfil</button>
            <button onclick="window.location.href='/'">🏠 Inicio</button>
        </div>
    </main>

    <script>
        // 🔍 Obtener el parámetro 'email' desde la URL
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get("email");

        async function cargarRutina() {
            if (!email) {
                document.getElementById("loading").innerText = "❌ No se encontró el correo del usuario.";
                return;
            }

            try {
                const response = await fetch(`/api/rutina?email=${encodeURIComponent(email)}`);

                if (!response.ok) {
                    throw new Error("No se pudo obtener la rutina.");
                }

                const data = await response.json();
                mostrarRutina(data);
            } catch (error) {
                console.error(error);
                document.getElementById("loading").innerText = "❌ Error al cargar la rutina.";
            }
        }

        function mostrarRutina(rutina) {
            const container = document.getElementById("rutinaContainer");
            container.innerHTML = "";
            document.getElementById("loading").style.display = "none";
            container.style.display = "grid";

            if (!rutina || rutina.length === 0) {
                container.innerHTML = "<p>No se encontraron recomendaciones disponibles.</p>";
                return;
            }

            rutina.forEach(producto => {
                const card = document.createElement("div");
                card.classList.add("producto");

                card.innerHTML = `
                    <img src="${producto.image_url || '/static/default.png'}" alt="${producto.nombre}">
                    <h4>${producto.nombre}</h4>
                    <p>${producto.descripcion}</p>
                    <p><strong>Uso:</strong> ${producto.uso}</p>
                `;

                container.appendChild(card);
            });
        }

        function volverPerfil() {
            window.location.href = `/perfil?email=${encodeURIComponent(email)}`;
        }

        // 🚀 Ejecutar al cargar la página
        window.onload = cargarRutina;
    </script>
</body>
</html>
