{% extends "base.html" %}

{% block title %}Tu Rutina Personalizada{% endblock %}

{% block content %}
<style>
    .rutina-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 2rem;
        background: #fff0f5;
        border-radius: 1rem;
        box-shadow: 0 4px 15px rgba(230, 120, 150, 0.3);
        text-align: center;
    }

    .email-form input {
        width: 70%;
        padding: 0.8rem;
        margin-bottom: 1rem;
        border-radius: 0.75rem;
        border: 1px solid #f2a2b3;
        font-size: 1rem;
    }

    .email-form button {
        padding: 0.8rem 1.5rem;
        background-color: #e75480;
        color: white;
        border: none;
        border-radius: 1rem;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .email-form button:hover {
        background-color: #d23b65;
    }

    h2 {
        color: #e75480;
        margin-bottom: 1.5rem;
    }

    .rutina-section {
        margin-top: 2rem;
        text-align: left;
    }

    .rutina-section h3 {
        background: #f8c6d8;
        color: #fff;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        display: inline-block;
    }

    .rutina-paso {
        display: flex;
        align-items: flex-start;
        gap: 15px;
        margin-top: 1rem;
        background: #fff;
        border-radius: 12px;
        border: 1px solid #f8c6d8;
        padding: 1rem;
        box-shadow: 0 2px 5px rgba(255, 182, 193, 0.3);
        transition: transform 0.2s ease;
    }

    .rutina-paso:hover {
        transform: translateY(-4px);
    }

    .rutina-paso img {
        width: 100px;
        height: 100px;
        border-radius: 10px;
        border: 2px solid #f2a2b3;
        object-fit: cover;
    }

    .rutina-paso h4 {
        margin: 0;
        color: #e75480;
    }

    .rutina-paso p {
        margin: 4px 0;
        color: #555;
        font-size: 0.9rem;
    }

    .no-datos {
        text-align: center;
        font-style: italic;
        color: #999;
    }

</style>

<div class="rutina-container">
    <h2>✨ Tu Rutina Personalizada de Cuidado Facial ✨</h2>

    <div class="email-form">
        <input type="email" id="email" placeholder="Ingresa tu correo electrónico" value="{{ request.query_params.email or '' }}">
        <br>
        <button type="button" onclick="verificarUsuario()">Ver mi rutina</button>
    </div>

    <div id="contenedor-rutina">
        <p class="no-datos">Esperando datos...</p>
    </div>
</div>

<script>
async function verificarUsuario() {
    const email = document.getElementById("email").value.trim();
    const contenedor = document.getElementById("contenedor-rutina");
    if (!email) {
        contenedor.innerHTML = "<p class='no-datos'>Por favor, ingresa un correo válido.</p>";
        return;
    }

    contenedor.innerHTML = "<p class='no-datos'>Buscando información...</p>";

    try {
        const resp = await fetch(`/api/rutina?email=${encodeURIComponent(email)}`);
        const data = await resp.json();

        contenedor.innerHTML = "";

        if (!data || (!data.manana && !data.noche)) {
            contenedor.innerHTML = "<p class='no-datos'>No se pudo generar tu rutina. Asegúrate de haber realizado el test de hábitos.</p>";
            return;
        }

        // Crear sección de Rutina de Mañana
        if (data.manana && data.manana.length > 0) {
            const secManana = document.createElement("div");
            secManana.className = "rutina-section";
            secManana.innerHTML = "<h3>🌞 Rutina de Mañana</h3>";
            data.manana.forEach(prod => secManana.appendChild(crearCardProducto(prod)));
            contenedor.appendChild(secManana);
        }

        // Crear sección de Rutina de Noche
        if (data.noche && data.noche.length > 0) {
            const secNoche = document.createElement("div");
            secNoche.className = "rutina-section";
            secNoche.innerHTML = "<h3>🌙 Rutina de Noche</h3>";
            data.noche.forEach(prod => secNoche.appendChild(crearCardProducto(prod)));
            contenedor.appendChild(secNoche);
        }

    } catch (err) {
        console.error(err);
        contenedor.innerHTML = "<p class='no-datos'>Error al cargar rutina.</p>";
    }
}

function crearCardProducto(p) {
    const card = document.createElement("div");
    card.className = "rutina-paso";

    const img = document.createElement("img");
    img.src = p.image_url || "/static/img/default-product.png";

    const info = document.createElement("div");
    info.innerHTML = `
        <h4>${p.product_name}</h4>
        <p><strong>Tipo:</strong> ${p.product_type}</p>
        <p><strong>Ingredientes:</strong> ${p.clean_ingreds?.slice(0, 100) || 'N/A'}...</p>
        <p><a href="${p.product_url}" target="_blank" style="color:#e75480;">Ver producto</a></p>
    `;

    card.appendChild(img);
    card.appendChild(info);
    return card;
}
</script>
{% endblock %}
