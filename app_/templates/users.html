{% extends "base.html" %}

{% block title %}Registro de Usuario{% endblock %}

{% block content %}
<h2>Registro de Usuario</h2>
<form id="formularioRegistro" class="formulario">
    <label for="name">Nombre:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="mail">Correo electrónico:</label><br>
    <input type="email" id="mail" name="mail" required><br><br>

    <label for="type_skin">Tipo de piel:</label><br>
    <select id="type_skin" name="type_skin" required>
        <option value="">Seleccione</option>
        <option value="seca">Seca</option>
        <option value="grasa">Grasa</option>
        <option value="mixta">Mixta</option>
        <option value="normal">Normal</option>
    </select><br><br>

    <label>
        <input type="checkbox" id="preferences" name="preferences">
        Acepto recibir recomendaciones personalizadas
    </label><br><br>

    <button type="submit">Registrarse</button>
</form>

<script>
document.getElementById("formularioRegistro").addEventListener("submit", async function (e) {
    e.preventDefault();

    const preferencesChecked = e.target.preferences.checked;

    const data = {
        name: e.target.name.value,
        mail: e.target.mail.value,
        type_skin: e.target.type_skin.value,
        preferences: preferencesChecked
    };

    try {
        const response = await fetch("/api/usuarios", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            localStorage.setItem("user_id", result.id);  // Guarda el ID del nuevo usuario

            if (preferencesChecked) {
                window.location.href = "/test-habitos";  // Solo si quiere recomendaciones
            } else {
                alert("Registro exitoso. No se solicitarán recomendaciones.");
                // Puedes redirigir a otra página si quieres, por ejemplo:
                // window.location.href = "/gracias";
            }
        } else {
            alert("Error al registrar usuario: " + (result.detail || "Revisa los campos"));
        }
    } catch (error) {
        alert("Error de conexión con el servidor.");
    }
});
</script>
{% endblock %}
