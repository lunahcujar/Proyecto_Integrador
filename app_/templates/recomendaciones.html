{% extends "base.html" %}

{% block title %}Recomendaciones de Productos{% endblock %}

{% block content %}
<style>
    .recomendaciones-section {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 2rem;
        padding: 2rem;
        background-color: #fef6f8;
    }

    .imagen-limpieza {
        max-width: 400px;
        width: 100%;
        border-radius: 1.5rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .recomendaciones-container {
        max-width: 600px;
        width: 100%;
    }

    .recomendaciones-container h2 {
        text-align: center;
        color: #2f80ed;
        margin-bottom: 1.5rem;
    }

    .producto-card {
        border: 1px solid #ddd;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 20px;
        box-shadow: 0px 6px 16px rgba(0, 0, 0, 0.05);
        display: flex;
        gap: 15px;
        align-items: center;
        background-color: #fff;
    }

    .producto-card img {
        width: 90px;
        height: 90px;
        object-fit: cover;
        border-radius: 10px;
    }

    .producto-info {
        flex-grow: 1;
    }

    .producto-info h3 {
        margin: 0;
        color: #333;
    }

    .producto-info p {
        margin: 4px 0;
        color: #666;
        font-size: 0.95rem;
    }
</style>

<div class="recomendaciones-section">
    <img src="/static/img/skincare-1.jpg" alt="Limpieza Facial" class="imagen-limpieza">

    <div class="recomendaciones-container">
        <h2 id="titulo">Cargando recomendaciones...</h2>
        <div id="contenedor-productos"></div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
    const user_id = localStorage.getItem("user_id");

    if (!user_id) {
        document.getElementById("titulo").innerText = "Usuario no identificado.";
        return;
    }

    try {
        const usuarioResp = await fetch(`/api/usuarios/${user_id}`);
        if (!usuarioResp.ok) {
            document.getElementById("titulo").innerText = "No se pudo obtener el usuario.";
            return;
        }

        const usuario = await usuarioResp.json();
        const tipoPiel = usuario.type_skin;

        const productosResp = await fetch(`/api/productos?skin_type=${tipoPiel}`);
        const productos = await productosResp.json();
        const contenedor = document.getElementById("contenedor-productos");

        if (!productos.length) {
            document.getElementById("titulo").innerText = `No se encontraron productos para piel ${tipoPiel}.`;
            return;
        }

        document.getElementById("titulo").innerText = `Productos recomendados para piel ${tipoPiel}`;

        productos.forEach(producto => {
            const card = document.createElement("div");
            card.className = "producto-card";

            const imagen = document.createElement("img");
            imagen.src = producto.image_url || "/static/img/default-product.png";
            imagen.alt = producto.name;

            const info = document.createElement("div");
            info.className = "producto-info";
            info.innerHTML = `
                <h3>${producto.name}</h3>
                <p><strong>Descripción:</strong> ${producto.description}</p>
                <p><strong>Tipo de piel:</strong> ${producto.skin_type}</p>
            `;

            card.appendChild(imagen);
            card.appendChild(info);
            contenedor.appendChild(card);
        });

    } catch (error) {
        console.error("Error al cargar productos:", error);
        document.getElementById("titulo").innerText = "Error al cargar las recomendaciones.";
    }
});
</script>
{% endblock %}
