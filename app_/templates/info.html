{% extends "base.html" %}

{% block content %}
<h2 style="text-align: center; color: #a85d74; margin-bottom: 2rem;">Información del Proyecto</h2>

<!-- Botones tipo pestaña -->
<div id="tab-buttons" style="display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;">
    <button class="tab-btn" onclick="mostrarSeccion('desarrollador')">👩‍💻 Desarrollador</button>
    <button class="tab-btn" onclick="mostrarSeccion('planeacion')">🧠 Planeación</button>
    <button class="tab-btn" onclick="mostrarSeccion('diseno')">🎨 Diseño</button>
    <button class="tab-btn" onclick="mostrarSeccion('objetivo')">🎯 Objetivo</button>
</div>

<!-- Contenedor del contenido dinámico -->
<div id="contenido-info" style="max-width: 900px; margin: auto; padding: 1rem; background: #fff8fa; border-radius: 10px; border: 1px solid #ecc1cf;">

    <p style="text-align: center; color: #888;">Haz clic en una sección para ver la información.</p>

</div>

<script>
async function mostrarSeccion(nombre) {
    const contenedor = document.getElementById("contenido-info");
    contenedor.innerHTML = "<p style='text-align:center;'>Cargando información...</p>";

    try {
        const res = await fetch(`/info/${nombre}`);
        const data = await res.json();

        let html = `<h3 style="color: #a85d74; margin-bottom: 1rem; text-align: center;">${nombre.charAt(0).toUpperCase() + nombre.slice(1)}</h3>`;

        for (const [clave, valor] of Object.entries(data)) {
    html += `<div style="margin-bottom: 1.2rem;">`;
    html += `<strong>${formatearClave(clave)}:</strong><br>`;

    if (Array.isArray(valor)) {
        html += `<ul style="margin-top: 0.5rem; padding-left: 1.2rem;">`;
        valor.forEach(v => html += `<li>${v}</li>`);
        html += `</ul>`;
    } else if (typeof valor === "object" && valor !== null) {
        html += `<ul style="margin-top: 0.5rem; padding-left: 1.2rem;">`;
        for (const [k, v] of Object.entries(valor)) {
            html += `<li><strong>${k}:</strong> ${Array.isArray(v) ? v.join(", ") : v}</li>`;
        }
        html += `</ul>`;
    } else {
        // Aquí se detecta si es una URL para hacerla clickeable
        if (typeof valor === "string" && valor.startsWith("http")) {
            html += `<p style="margin-top: 0.3rem;"><a href="${valor}" target="_blank" style="color: #007bff;">${valor}</a></p>`;
        } else {
            html += `<p style="margin-top: 0.3rem;">${valor}</p>`;
        }
    }

    html += `</div>`;
}


        contenedor.innerHTML = html;
    } catch (error) {
        contenedor.innerHTML = "<p style='color: red; text-align: center;'>Error al cargar la información.</p>";
    }
}

function formatearClave(clave) {
    return clave.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
}
</script>

<!-- Estilos adicionales para los botones -->
<style>
.tab-btn {
    background-color: #a85d74;
    color: white;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    transition: background-color 0.3s;
}
.tab-btn:hover {
    background-color: #843a50;
}
</style>
{% endblock %}
