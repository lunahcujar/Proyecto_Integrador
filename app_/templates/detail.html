{% extends 'base.html' %}
{% block title %}Detalle - {{ nombre_modelo }}{% endblock %}
{% block content %}
<h2>Detalle de {{ nombre_modelo }}</h2>

<ul>
    {% for campo, valor in item.items() %}
        <li><strong>{{ campo|capitalize }}:</strong> {{ valor }}</li>
    {% endfor %}
</ul>

<a href="/{{ nombre_modelo|lower }}s">← Volver a la lista</a>
{% endblock %}
